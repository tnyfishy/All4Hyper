plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'io.github.tnyfishy.all4hyper'
    compileSdk { version = release(37) }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.tnyfishy.all4hyper'
        minSdk 35
        targetSdk 36
        versionCode 8
        versionName '0.6.1'
        // DexKit (live translate) ships a native library; HyperOS phones are 64-bit.
        ndk { abiFilters 'arm64-v8a' }
    }
    // One fixed key, kept in the repository (signing/all4hyper.jks), so every build is signed alike and
    // installs over the previous one. It is public, so it keeps updates working; it does not prove who built an APK.
    signingConfigs {
        release {
            storeFile rootProject.file('signing/all4hyper.jks')
            storePassword 'all4hyper'
            keyAlias 'all4hyper'
            keyPassword 'all4hyper'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.ui:ui'
    // Material 3 Expressive: LoadingIndicator, wavy progress indicators.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.core:core-ktx:1.17.0'
    // Finds the obfuscated live translate code in the Google app (Apache-2.0).
    implementation 'org.luckypray:dexkit:2.3.0'
}
