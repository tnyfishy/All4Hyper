name: Build APK

# Every push to main (and a manual run) builds the release APK and puts it on a temporary
# pre-release called "snapshot", which is replaced by the next build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already has the Android SDK (ANDROID_HOME); only the pieces this build
      # needs are added to it.
      - name: Install the SDK pieces the build needs
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -n 1)
          name="All4Hyper-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Replace the temporary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot ${{ steps.apk.outputs.version }} (temporary)" \
            --notes "Temporary build of commit ${GITHUB_SHA::7}. It is replaced by the next build. Every build is signed with the same key (signing/all4hyper.jks), so it installs over the previous build when its version is higher. A build from before 0.6.1 was signed with a different key: uninstall it once first."
